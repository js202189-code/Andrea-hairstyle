<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Andrea's Dashboard</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{--ink:#241f20;--muted:#756b6d;--cream:#fbf7f3;--gold:#a9824d;--line:#eadfda;--ok:#2f6b3a;--warn:#9a4b2f}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}
.container{width:min(760px,92%);margin:40px auto 80px}
h1{font-family:Georgia,serif;font-size:36px;margin:0 0 6px}
.sub{color:var(--muted);margin-bottom:36px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:24px}
.card h2{font-family:Georgia,serif;font-size:22px;margin:0 0 6px}
.card p.hint{color:var(--muted);font-size:14px;margin:0 0 18px}
label{font-size:13px;font-weight:700;display:block;margin-top:14px}
input,select,textarea{width:100%;margin-top:6px;border:1px solid #ddd0cc;border-radius:12px;padding:12px;font:inherit;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;background:var(--ink);color:#fff;border:none;cursor:pointer;font-family:inherit;margin-top:18px}
.btn:disabled{opacity:.6}
.links{display:flex;gap:12px;flex-wrap:wrap}
.links a{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600}
.status{padding:12px 16px;border-radius:12px;font-size:14px;margin-top:14px}
.status:empty{display:none}
.status-ok{background:#eaf3ea;color:var(--ok)}
.status-warn{background:#f6e9e2;color:var(--warn)}
.lock{max-width:420px;margin:120px auto;text-align:center}
.lock input{text-align:center}
.hidden{display:none}
.hp-field{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>

<div class="container lock" id="lock-screen">
  <h1>Andrea's Dashboard</h1>
  <p class="sub">For security, website administration now happens inside Andrea’s private Google Sheet and Calendar while she is signed into Google.</p>
  <p>This public page no longer accepts an access phrase or publishes content.</p>
</div>

</body>
</html>
